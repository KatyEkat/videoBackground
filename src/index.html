<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>Masked Video Text</title>
		<link rel="stylesheet" href="./styles/style.css" />
	</head>

	<body>
		<div class="container">
			<video autoplay muted loop playsinline>
				<source src="./vid/video.mp4" type="video/mp4" />
			</video>

			<div class="text">
				We’re here <span class="line">██████</span> to make<br />
				healthy <span class="line">██████</span> living effortless,<br />
				so you can <span class="line">█████████</span> live longer<br />
				and happier <span class="line">████████████</span>
			</div>

			<svg>
				<defs>
					<mask id="mask" x="0" y="0" width="100%" height="100%">
						<rect x="0" y="0" width="100%" height="100%" fill="black" />
					</mask>
				</defs>
				<g id="mask" mask="url(#mask)"></g>
			</svg>
		</div>

		<script src="./js/index.js"></script>
	</body>
</html>
